name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12 and pip cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            demo/requirements.txt
            requirements-dev.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project, demo, and development dependencies
        run: python -m pip install -r requirements.txt -r demo/requirements.txt -r requirements-dev.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Prepare data for CPU tests
        run: |
          python -m src.data.download_hacking
          python -m src.data.build_pool

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run all tests, including demo and integration tests when present
        run: python -m pytest -q -rs
